<!DOCTYPE html>
<html lang="ko" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제갈량 상소문</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bar" role="toolbar" aria-label="보기 설정">
  <button type="button" id="btn-prev" title="하루 전 상소">◀ 어제</button>
  <button type="button" id="btn-today" title="오늘 상소">오늘</button>
  <button type="button" id="btn-next" title="하루 뒤 상소">내일 ▶</button>
  <span class="gap"></span>
  <button type="button" id="btn-small" title="글자 작게">가−</button>
  <button type="button" id="btn-big" title="글자 크게">가＋</button>
  <button type="button" id="btn-theme" title="낮/밤 바꾸기">밤 · 낮</button>
  <button type="button" id="btn-kakao" title="카카오톡 '나와의 채팅'에 붙여 넣을 200자 요약을 복사합니다">카톡용 복사</button>
  <button type="button" id="btn-print" title="인쇄">인쇄</button>
</div>

<main class="scroll" id="scroll">
  <header class="head">
    <div class="seal" aria-hidden="true">亮</div>
    <h1>제갈량 상소문</h1>
    <p class="sub"><span id="who">무한돈전</span> 주공께 올리는 아침 상소</p>
    <p class="date" id="date"></p>
    <p class="legend">
      글 속의 꼬리표 —
      <span class="tag t-fact">사실</span> 확인된 일
      <span class="tag t-interp">해석</span> 신의 풀이
      <span class="tag t-assume">가정</span> 그렇다고 치고 한 계산
      <span class="tag t-unk">미확인</span> 확인하지 못함
    </p>
  </header>

  <section id="intro" class="intro"></section>
  <section id="court" class="court" aria-label="오늘의 조정"></section>
  <section id="part1" class="part"></section>
  <section id="part2" class="part"></section>
  <section id="part3" class="part"></section>
  <section id="outro" class="intro"></section>

  <footer class="foot" id="foot"></footer>
</main>

<noscript><p style="padding:2em;font-size:1.2em">이 상소문은 자바스크립트가 켜진 브라우저에서 열어야 합니다.</p></noscript>

<script charset="utf-8" src="profile.js"></script>
<script charset="utf-8" src="content0.js"></script>
<script charset="utf-8" src="content1.js"></script>
<script charset="utf-8" src="content2a.js"></script>
<script charset="utf-8" src="content2b.js"></script>
<script charset="utf-8" src="content3.js"></script>
<script charset="utf-8" src="kakao.js"></script>
<script charset="utf-8" src="app.js"></script>
</body>
</html>
